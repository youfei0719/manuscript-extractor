name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "稿件提取 v__VERSION__"
          releaseBody: "在下方下载适合您操作系统的安装包。"
          releaseDraft: false
          prerelease: false
          assetNamePattern: "稿件提取_[version]_[arch][_setup][ext]"
          args: --target aarch64-apple-darwin --bundles app
      - name: Re-sign app and create DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/稿件提取.app"
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_DIR="$(mktemp -d)"
          DMG_RAW="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/稿件提取-${VERSION}-AppleSilicon.dmg"
          DMG="$RELEASE_DIR/稿件提取-v${VERSION}-macOS-AppleSilicon.dmg"
          DMG_STAGE="$(mktemp -d)"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          cp -R "$APP" "$DMG_STAGE/稿件提取.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          mkdir -p "$(dirname "$DMG_RAW")"
          hdiutil create -volname "稿件提取" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_RAW"
          rm -rf "$DMG_STAGE"
          cp "$DMG_RAW" "$DMG"
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/稿件提取.app.tar.gz" "$RELEASE_DIR/稿件提取-v${VERSION}-macOS-AppleSilicon.app.tar.gz"
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/稿件提取.app.tar.gz.sig" "$RELEASE_DIR/稿件提取-v${VERSION}-macOS-AppleSilicon.app.tar.gz.sig"
          gh release upload "v${VERSION}" \
            "$DMG" \
            "$RELEASE_DIR/稿件提取-v${VERSION}-macOS-AppleSilicon.app.tar.gz" \
            "$RELEASE_DIR/稿件提取-v${VERSION}-macOS-AppleSilicon.app.tar.gz.sig" --clobber
          gh release delete-asset "v${VERSION}" "_${VERSION}_aarch64.app.tar.gz" --yes || true
          gh release delete-asset "v${VERSION}" "_${VERSION}_aarch64.app.tar.gz.sig" --yes || true
          rm -rf "$RELEASE_DIR"
          if [ -f "release-notes/${VERSION}.md" ]; then gh release edit "v${VERSION}" --notes-file "release-notes/${VERSION}.md"; fi

  release-windows:
    needs: release-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "稿件提取 v__VERSION__"
          releaseBody: "在下方下载适合您操作系统的安装包。"
          releaseDraft: false
          prerelease: false
          assetNamePattern: "稿件提取_[version]_[arch][_setup][ext]"
          args: --bundles msi,nsis
      - name: Publish clearly named Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_DIR="$(mktemp -d)"
          cp "src-tauri/target/release/bundle/nsis/稿件提取_${VERSION}_x64-setup.exe" "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64-Setup.exe"
          cp "src-tauri/target/release/bundle/nsis/稿件提取_${VERSION}_x64-setup.exe.sig" "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64-Setup.exe.sig"
          cp "src-tauri/target/release/bundle/msi/稿件提取_${VERSION}_x64_zh-CN.msi" "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64.msi"
          cp "src-tauri/target/release/bundle/msi/稿件提取_${VERSION}_x64_zh-CN.msi.sig" "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64.msi.sig"
          gh release upload "v${VERSION}" \
            "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64-Setup.exe" \
            "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64-Setup.exe.sig" \
            "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64.msi" \
            "$RELEASE_DIR/稿件提取-v${VERSION}-Windows-x64.msi.sig" --clobber
          gh release delete-asset "v${VERSION}" "_${VERSION}_x64_setup.exe" --yes || true
          gh release delete-asset "v${VERSION}" "_${VERSION}_x64_setup.exe.sig" --yes || true
          gh release delete-asset "v${VERSION}" "_${VERSION}_x64.msi" --yes || true
          gh release delete-asset "v${VERSION}" "_${VERSION}_x64.msi.sig" --yes || true
          rm -rf "$RELEASE_DIR"

  finalize-release:
    needs: release-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish detailed Chinese release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --notes-file "release-notes/${VERSION}.md"
      - name: Publish updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/updater
          MAC_TAR="稿件提取-v${VERSION}-macOS-AppleSilicon.app.tar.gz"
          WIN_EXE="稿件提取-v${VERSION}-Windows-x64-Setup.exe"
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "${MAC_TAR}.sig" --dir /tmp/updater
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "${WIN_EXE}.sig" --dir /tmp/updater
          MAC_SIG=$(cat "/tmp/updater/${MAC_TAR}.sig")
          WIN_SIG=$(cat "/tmp/updater/${WIN_EXE}.sig")
          MAC_URL=$(gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq ".assets[] | select(.name == \"${MAC_TAR}\") | .url")
          WIN_URL=$(gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq ".assets[] | select(.name == \"${WIN_EXE}\") | .url")
          jq -n --arg version "$VERSION" --arg notes "$(cat release-notes/${VERSION}.md)" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg macSig "$MAC_SIG" --arg macUrl "$MAC_URL" --arg winSig "$WIN_SIG" --arg winUrl "$WIN_URL" '{version:$version,notes:$notes,pub_date:$date,platforms:{"darwin-aarch64":{signature:$macSig,url:$macUrl},"windows-x86_64":{signature:$winSig,url:$winUrl}}}' > /tmp/updater/latest.json
          gh release upload "v${VERSION}" /tmp/updater/latest.json --repo "${GITHUB_REPOSITORY}" --clobber
